name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Validation du catalogue et tests de bout en bout
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci || npm install

      # Rapide et sans navigateur : échoue tôt si le catalogue est cassé.
      - name: Valider les fichiers data/*.json
        run: npm run validate

      - name: Installer le navigateur de test
        run: npx playwright install --with-deps chromium

      # Inclut les tests d'injection : ils échouent si l'échappement HTML régresse.
      - name: Lancer la suite de tests
        run: npm test
